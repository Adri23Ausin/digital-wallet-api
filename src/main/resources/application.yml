spring:
  application:
    name: digital-wallet-api
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

wallet:
  security:
    jwt:
      # Development-only key. Always set JWT_SECRET (base64, >= 256 bits) outside your machine.
      secret: ${JWT_SECRET:BUCDjivWWgoiQOH7TZnw+u7eY7IbdwSrsX8CzYlOXm8=}
      issuer: digital-wallet-api
      ttl: 15m

management:
  endpoints:
    web:
      exposure:
        include: health, info
